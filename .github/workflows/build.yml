name: Build + Publish

on:
  push:
    branches:
      - scarlett
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      # ---------------------------------------------------
      # COMPUTE VERSION
      # ---------------------------------------------------

      - name: Get Next Version
        if: github.event_name == 'workflow_dispatch'
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: ${{ github.ref_name }}
          skipInvalidTags: true
          patchAll: true

      - name: Set Build Variables (Release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "REL_VERSION=${{ steps.semver.outputs.nextStrict }}" >> $GITHUB_ENV

      - name: Set Build Variables (Dev)
        if: github.event_name != 'workflow_dispatch'
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "3.0.0")
          echo "REL_VERSION=${LATEST_TAG}-dev.${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set Version
        run: |
          yq -iP '.version = strenv(REL_VERSION)' backend/package.json -o json
          yq -iP '.version = strenv(REL_VERSION)' frontend/package.json -o json
          yq -i '.version = strenv(REL_VERSION) | .appVersion = strenv(REL_VERSION)' dev/chart/Chart.yaml

      - name: Create Draft Release
        if: github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1.21.0
        with:
          prerelease: true
          draft: false
          commit: ${{ github.sha }}
          tag: ${{ env.REL_VERSION }}
          name: ${{ env.REL_VERSION }}
          body: '*pending*'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CHANGELOG
        if: github.event_name == 'workflow_dispatch'
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ env.REL_VERSION }}
          writeToFile: false

      # ---------------------------------------------------
      # UPLOAD SOURCE TRANSLATIONS
      # ---------------------------------------------------
      - name: Upload translations source file
        if: env.CROWDIN_PERSONAL_TOKEN != ''
        uses: crowdin/github-action@v3
        env:
          CROWDIN_BASE_PATH: ${{ github.workspace }}
        with:
          command: 'upload'
          command_args: '--config dev/crowdin.yml'

      # ---------------------------------------------------
      # BUILD FRONTEND
      # ---------------------------------------------------
      - name: Build Assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Blocks
        working-directory: blocks
        run: |
          npm ci
          npm run build

      # Images are published only to the live AWS ECR repository asendio-wiki
      # by deploy-live.yml. This workflow does not push to requarks/wiki,
      # ghcr.io/requarks/wiki, or Docker Hub.

      - name: Login to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------
      # BUILD HELM/OCI CHARTS
      # ---------------------------------------------------
      - name: Set up Helm
        if: github.event_name == 'workflow_dispatch'
        uses: azure/setup-helm@v5

      - name: Package and push Helm chart
        if: github.event_name == 'workflow_dispatch'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm lint --strict dev/chart
          helm package dev/chart --destination _chart
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
          helm push "_chart/wiki-${REL_VERSION}.tgz" oci://ghcr.io/requarks/charts

      # ---------------------------------------------------
      # PACKAGE BUILD TARBALL
      # ---------------------------------------------------
      - name: Prepare build archive
        run: |
          mkdir -p _dist/blocks
          cp -R assets _dist/assets
          cp -R blocks/compiled _dist/blocks/compiled
          cp -R backend _dist/backend
          cp LICENSE _dist/LICENSE
          cp config.sample.yml _dist/config.sample.yml
          cd _dist/backend
          npm ci --omit=dev
          cd -
          find ./_dist/ -printf "%P\n" | tar -czf wiki-js.tar.gz --no-recursion -C ./_dist/ -T -

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: wiki-js.tar.gz

      # ---------------------------------------------------
      # FINALIZE RELEASE
      # ---------------------------------------------------
      - name: Finalize Release
        if: github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          makeLatest: true
          draft: false
          tag: ${{ env.REL_VERSION }}
          name: ${{ env.REL_VERSION }}
          body: ${{ steps.changelog.outputs.changes }}
          artifacts: "wiki-js.tar.gz"
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------
      # NOTIFY
      # ---------------------------------------------------
      - name: Notify Telegram Channel
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: node dev/ci/notify-telegram.js

      - name: Notify Discord Channel
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node dev/ci/notify-discord.js

      - name: Notify Bluesky
        if: github.event_name == 'workflow_dispatch'
        env:
          BSKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node dev/ci/notify-bluesky.js

